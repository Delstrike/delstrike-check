[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "delstrike-check"
dynamic = ["version"]
description = "Free, local security checks for vibecoded apps on Supabase and Firebase. Nothing leaves your machine."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "DELSTRIKE", email = "info@delstrike.com" }]
keywords = ["security", "supabase", "firebase", "rls", "sast", "vibecoding", "linter", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# Zero runtime dependencies, on purpose: nothing to audit but this package.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
delstrike-check = "delstrike_check.__main__:main"

[project.urls]
Homepage = "https://www.delstrike.com/checkpoint/cli"
Rules = "https://www.delstrike.com/checkpoint/rules"
Source = "https://github.com/delstrike/delstrike-check"
Issues = "https://github.com/delstrike/delstrike-check/issues"
Changelog = "https://github.com/delstrike/delstrike-check/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/delstrike_check/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/delstrike_check"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
