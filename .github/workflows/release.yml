# Publish to PyPI with Trusted Publishing (OIDC, no tokens) and build provenance attestations.
# One-time setup on pypi.org: add a trusted publisher for this repository, workflow `release.yml`, environment `pypi`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build pytest
      - run: python -m pytest
      - name: Tag matches package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/delstrike_check/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: python -m build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
